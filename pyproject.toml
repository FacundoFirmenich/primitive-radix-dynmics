[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "primitive-radix-mobius-dynamics"
version = "0.3.3"
description = "Exact certificates and reproducibility for primitive radix–Möbius dynamics"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name="Facundo Firmenich"}]
dependencies = []

[project.optional-dependencies]
figures = ["matplotlib>=3.8,<4", "cairosvg>=2.7,<3"]
dev = ["numpy>=1.24,<3", "pytest>=8,<10", "matplotlib>=3.8,<4", "sympy>=1.14,<2", "mpmath>=1.3,<2", "cairosvg>=2.7,<3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
