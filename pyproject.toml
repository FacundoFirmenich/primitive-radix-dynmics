[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "primitive-radix-dynamics"
version = "0.3.0rc7"
description = "Exact certificates and reproducibility for primitive radix dynamics"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name="Facundo Firmenich"}]
dependencies = []

[project.optional-dependencies]
figures = ["matplotlib>=3.8,<4"]
dev = ["pytest>=8,<10", "matplotlib>=3.8,<4", "sympy>=1.14,<2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
